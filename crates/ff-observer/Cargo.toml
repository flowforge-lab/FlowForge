[package]
name = "ff-observer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, features = ["serde-json-impl"] }
async-trait = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# `serde` so `ObserverInfo.started_at: DateTime<Utc>` can derive Serialize for
# the `list_observers` command / ts-rs bindings (#1038). Cargo merges features
# additively, so this only extends the workspace chrono.
chrono = { workspace = true, features = ["serde"] }
globset = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
url = { workspace = true }
regex = { workspace = true }
ff-core = { workspace = true }
ff-tools = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
kqueue = "1.2"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
