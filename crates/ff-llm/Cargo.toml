[package]
name = "ff-llm"
version = "1.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ff-core = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
httpdate = "1"
tokenx-rs = { workspace = true }

# Document text-extraction fallback (#338 follow-up): HTML→markdown via the same
# `fast_html2md` rewriter `ff-tools` uses; `zip` + `quick-xml` crack the OOXML
# containers (DOCX/XLSX) and pull their text. `zip` is pinned to deflate-only
# (DOCX/XLSX use deflate) so we don't pull in bzip2/lzma/ppmd/zstd/xz for a
# format we never read. `quick-xml` has no default features to disable.
fast_html2md = { workspace = true }
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.39", default-features = false }

# Bedrock provider (#202). default-features=false + an explicit rustls-ring HTTP
# client keeps us off aws-lc-rs, which needs cmake/nasm on CI runners.
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    # default-features = false (rustls-ring discipline, no aws-lc) also drops
    # these two from the aws-config defaults; re-add them so Profile auth works:
    # credentials-process runs credential_process profiles (e.g. ada), sso handles
    # SSO profiles. Without them a profile resolves no credentials and every
    # Bedrock call fails at request construction (#202).
    "credentials-process",
    "sso",
] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
# Control-plane client, used only by list_models (ListInferenceProfiles). Same
# no-aws-lc-rs discipline as the runtime crate above.
aws-sdk-bedrock = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
aws-smithy-types = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }

[dev-dependencies]
tokio = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
