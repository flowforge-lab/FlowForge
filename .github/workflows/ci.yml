name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache the WebKit/GTK dev libs the Tauri crate (`flowforge-desktop`) links
      # against. The .debs + transitive deps are restored from the Actions cache,
      # so a hit takes seconds; a miss does one normal install and seeds the cache.
      # This kills the 16-33 min tail we saw when the apt mirror was slow.
      - name: Install Linux WebKit deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        timeout-minutes: 5
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev
          version: 1.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # nextest's global process-per-test scheduler runs all 1818 tests in
      # parallel and to completion (no per-binary fail-fast masking). It is
      # ~80% of incremental CI wall-clock (#1072). It does not run doctests,
      # so those get a separate `cargo test --doc` step below.
      - uses: taiki-e/install-action@nextest

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo nextest
        run: cargo nextest run --workspace

      # ts-rs re-emits apps/desktop/src/bindings/ during the test run above, so
      # a diff here means a #[derive(TS)] type changed without the generated TS
      # being regenerated and committed (#1238). Fix by re-running the tests and
      # committing the result — never by hand-editing the binding.
      - name: bindings up to date
        run: git diff --exit-code -- apps/desktop/src/bindings/

      - name: cargo doctests
        run: cargo test --workspace --doc

  windows-check:
    name: Windows (compile check + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # nextest for the Windows runtime coverage too (mirrors the Linux job
      # in #1072): process-per-test so the #[cfg(windows)] tree-kill / jail
      # tests get real coverage without fail-fast masking. Doctests get a
      # separate `cargo test --doc` step (nextest doesn't run them).
      - uses: taiki-e/install-action@nextest

      # ff-tools and ff-mcp carry the #[cfg(windows)] code (process Job Object
      # kill path + the `#607` `tracing::warn!` diagnostics; MCP PATHEXT shim
      # resolution, #596). The Linux job never compiles it, so this guards
      # against bit-rot.
      - name: cargo check (ff-tools + ff-mcp)
        run: cargo check -p ff-tools -p ff-mcp --all-targets

      # Compile-only is not enough -- #605's Job-Object kill path is
      # correct-by-inspection without runtime coverage, and unix tests
      # (`echo`/`sleep`) don't run on Windows. Run the `#[cfg(windows)]`
      # tests in `process::tests::windows` (tree-kill via
      # `cmd /C ping -t`, #607) and the `jail::tests::windows_*` cases so
      # both crates get real Windows coverage.
      - name: cargo nextest (ff-tools + ff-mcp)
        run: cargo nextest run -p ff-tools -p ff-mcp --all-targets

      - name: cargo doctests (ff-tools + ff-mcp)
        run: cargo test -p ff-tools -p ff-mcp --doc

  web:
    name: Web (typecheck, lint, format, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      # Repo-wide, and deliberately before the pnpm install: a stray control
      # byte makes git treat the file as binary, which hides the change from
      # review entirely (#1185), so fail in seconds rather than after a build.
      # Overrides the job's working-directory because this covers Rust too.
      #
      # A step in an existing job rather than a job of its own: the scan is 0.2s
      # for the whole tree, while a dedicated job re-pays ~4s of runner setup and
      # checkout and takes a third concurrency slot. `web` is also the shortest of
      # the three jobs (~55s vs ~205s Rust, ~265s Windows), so this adds nothing
      # to wall-clock time -- CI duration is set by Windows.
      - name: Control characters
        working-directory: .
        run: |
          python3 scripts/check-control-chars.py --self-test
          python3 scripts/check-control-chars.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
