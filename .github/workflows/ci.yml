name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache the WebKit/GTK dev libs the Tauri crate (`flowforge-desktop`) links
      # against. The .debs + transitive deps are restored from the Actions cache,
      # so a hit takes seconds; a miss does one normal install and seeds the cache.
      # This kills the 16-33 min tail we saw when the apt mirror was slow.
      - name: Install Linux WebKit deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        timeout-minutes: 5
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev
          version: 1.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  windows-check:
    name: Windows (compile check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ff-tools and ff-mcp carry the #[cfg(windows)] code (process Job Object kill
      # path; MCP PATHEXT shim resolution, #596). The Linux job never compiles it, so
      # this guards against bit-rot.
      - name: cargo check (ff-tools + ff-mcp)
        run: cargo check -p ff-tools -p ff-mcp --all-targets

  web:
    name: Web (typecheck, lint, format, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
