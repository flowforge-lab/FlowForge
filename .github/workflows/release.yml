name: Release

# Cut a per-platform release build of the headless `flowforge` CLI whenever a
# `v*` tag is pushed. Produces one `flowforge-<target-triple>.tar.gz` archive
# per runner plus a consolidated SHA256SUMS file, all attached to the GitHub
# Release created from the tag.
#
# Only the CLI (`apps/cli`) is built here — NOT the Tauri desktop app. The CLI
# has no system-library dependencies (SQLite is `bundled`, TLS is `rustls`), so
# no WebKit/GTK/apt packages are required. The desktop app is released
# separately via its own bundling pipeline.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release and upload assets
  pull-requests: read # auto-generated release notes include merged PRs

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # Native builds only — each runner matches its target triple, so no
        # cross-compilation toolchain is needed.
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Reuse the same cache action as ci.yml, but keep release caches isolated
      # from CI's (release builds a single package for an explicit target).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p ff-cli --target ${{ matrix.target }}

      - name: Archive binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../flowforge-${{ matrix.target }}.tar.gz flowforge

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowforge-${{ matrix.target }}
          path: flowforge-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          echo '::group::Checksums'
          cat SHA256SUMS
          echo '::endgroup::'

      - name: Attach archives and checksums to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
