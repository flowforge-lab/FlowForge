name: Release

# Cut a unified release for the `flowforge` CLI *and* the FlowForge desktop
# (Tauri) app whenever a `v*` tag is pushed, or on demand via
# `workflow_dispatch` (pass the target `tag` input).
#
# Two build jobs fan out in parallel:
#   - build-cli   native matrix (macOS arm64 + Linux x86_64) -> per-target
#                 flowforge-<triple>.tar.gz archives
#   - desktop     macOS arm64 (macos-14) via tauri-action -> .dmg +
#                 FlowForge.app.tar.gz + .sig + auto-generated latest.json
#
# `desktop` owns creation of the GitHub Release (it must, so tauri-action can
# publish the updater feed). `release-cli` then attaches the CLI archives and a
# consolidated SHA256SUMS to that same release. One tag, one Release.
#
# The updater artifact (FlowForge.app.tar.gz) is minisign-signed with
# TAURI_SIGNING_PRIVATE_KEY; the matching pubkey ships in tauri.conf.json. The
# desktop feed (latest.json) is published at .../releases/latest/download so the
# in-app updater resolves the latest release (RFC 0014).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0). Defaults to the current ref. Must match a pushed v* tag.'
        required: false

permissions:
  contents: write # create the GitHub Release and upload assets
  pull-requests: read # auto-generated release notes include merged PRs

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # Native builds only — each runner matches its target triple, so no
        # cross-compilation toolchain is needed.
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Reuse the same cache action as ci.yml, but keep release caches isolated
      # from CI's (release builds a single package for an explicit target).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: release-cli-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p ff-cli --target ${{ matrix.target }}

      - name: Archive binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../flowforge-${{ matrix.target }}.tar.gz flowforge

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowforge-${{ matrix.target }}
          path: flowforge-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  desktop:
    name: Build desktop (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The Tauri frontend lives in apps/desktop (same JS toolchain as ci.yml's
      # `web` job): pnpm + Node, locked deps, then tauri-action builds + signs.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      # src-tauri is a workspace member, so cargo builds into the repo-root
      # target/ — cache it the same way ci.yml does (keyed on the workspace
      # root + Cargo.lock), just namespaced for release builds.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: release-desktop-aarch64

      # tauri-action builds the app (beforeBuildCommand runs `pnpm build`),
      # signs the updater artifact (.app.tar.gz + .sig) with the minisign key,
      # then creates the GitHub Release and uploads .dmg/.app.tar.gz/.sig plus
      # an auto-generated latest.json updater feed.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'FlowForge ${{ inputs.tag || github.ref_name }}'
          releaseDraft: false
          prerelease: false

  release-cli:
    name: Attach CLI archives to Release
    needs: [build-cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          echo '::group::Checksums'
          cat SHA256SUMS
          echo '::endgroup::'

      - name: Attach archives and checksums to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
