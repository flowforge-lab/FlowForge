[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri", "apps/cli"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/flowforge-lab/flowforge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
ts-rs = "10"
async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iana-time-zone = "0.1"
grep-regex = "0.1"
regex = "1"
grep-searcher = "0.1"
ignore = "0.4"
globset = "0.4"
reqwest = { version = "0.12", default-features = false }
url = "2"
fast_html2md = "0.0.62"
dom_smoothie = "0.18"
tempfile = "3"
toml = "0.8"
wiremock = "0.6"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rmcp = "1.7"

ff-core = { path = "crates/ff-core" }
ff-agent = { path = "crates/ff-agent" }
ff-llm = { path = "crates/ff-llm" }
ff-mcp = { path = "crates/ff-mcp" }
ff-memory = { path = "crates/ff-memory" }
ff-session = { path = "crates/ff-session" }
ff-scheduled = { path = "crates/ff-scheduled" }
ff-signals = { path = "crates/ff-signals" }
ff-skills = { path = "crates/ff-skills" }
ff-tools = { path = "crates/ff-tools" }
ff-observer = { path = "crates/ff-observer" }
ff-workflow = { path = "crates/ff-workflow" }

lru = "0.12"
