[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri", "apps/cli"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/flowforge-lab/flowforge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ts-rs = "10"
async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iana-time-zone = "0.1"
grep-regex = "0.1"
regex = "1"
grep-searcher = "0.1"
ignore = "0.4"
globset = "0.4"
reqwest = { version = "0.12", default-features = false }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
fast_html2md = "0.0.62"
dom_smoothie = "0.18"
bytes = "1"
tempfile = "3"
toml = "0.8"
sha2 = "0.10"
wiremock = "0.6"
tokenx-rs = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rmcp = "1.7"
agent-client-protocol = "2"

ff-core = { path = "crates/ff-core" }
ff-agent = { path = "crates/ff-agent" }
ff-llm = { path = "crates/ff-llm" }
ff-mcp = { path = "crates/ff-mcp" }
ff-memory = { path = "crates/ff-memory" }
ff-session = { path = "crates/ff-session" }
ff-scheduled = { path = "crates/ff-scheduled" }
ff-signals = { path = "crates/ff-signals" }
ff-skills = { path = "crates/ff-skills" }
ff-tools = { path = "crates/ff-tools" }
ff-observer = { path = "crates/ff-observer" }
ff-workflow = { path = "crates/ff-workflow" }
ff-transport = { path = "crates/ff-transport" }
ff-transport-slack = { path = "crates/ff-transport-slack" }
ff-logging = { path = "crates/ff-logging" }
ff-acp = { path = "crates/ff-acp" }

lru = "0.12"
minijinja = { version = "2", default-features = false, features = ["builtins", "std_collections", "macros", "adjacent_loop_items", "serde"] }
