[package]
name = "ff-cli"
version = "0.1.0"
description = "FlowForge headless CLI"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "flowforge"
path = "src/main.rs"

[dependencies]
ff-core = { workspace = true }
ff-agent = { workspace = true }
ff-llm = { workspace = true }
ff-memory = { workspace = true }
ff-session = { workspace = true }
ff-skills = { workspace = true }
ff-tools = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
# OS keychain backends, per-target like the desktop (#724). The CLI is its own
# binary and has no shared keychain crate, so each platform links the backend
# it needs. macOS also links security-framework for the Data Protection
# Keychain (see apps/cli/src/secrets.rs).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
