<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowForge</title>
    <style>
      /* Visible until React mounts. If this stays forever, JS never started;
         if the window is blank with no text, the webview itself failed to paint. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141414;
        color: #a3a3a3;
        /* Unlayered, so this outranks index.css's `@layer base` — a literal family
           here silently overrides the user's font for all body text (#1196). Keep it
           on the token, and use longhands: the `font:` shorthand resets family too.
           The script below sets `--font-sans` pre-paint, so this is FOUC-free. */
        font-size: 14px;
        line-height: 1.4;
        font-family: var(--font-sans, system-ui, sans-serif);
      }
      #root:empty {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
      }
      #root:empty::before {
        content: "Starting FlowForge…";
      }
    </style>
    <script>
      (function () {
        try {
          var fonts = {
            geist: '"Geist Variable", sans-serif',
            inter: '"Inter Variable", sans-serif',
            nunito: '"Nunito Variable", sans-serif',
            manrope: '"Manrope Variable", sans-serif',
            "jetbrains-mono": '"JetBrains Mono Variable", monospace',
          };
          var theme = "system";
          var font = "geist";
          // Prefs themselves now live in the Tauri store file (#1121) because a
          // WKWebView can drop a localStorage flush on quit. That store is only
          // readable asynchronously, which is no use before first paint — so the
          // store mirrors theme+font into `ff-boot-prefs` purely for this script.
          // It's a cache: a stale one costs a single wrong-theme frame, nothing
          // more. `ff-prefs` / `ff-theme` remain as fallbacks for the first launch
          // after upgrading, before the mirror has been written once.
          var raw =
            localStorage.getItem("ff-boot-prefs") ||
            localStorage.getItem("ff-prefs");
          if (raw) {
            var parsed = JSON.parse(raw);
            var state = parsed.state || parsed;
            if (state.theme) theme = state.theme;
            if (state.font) font = state.font;
          } else {
            var legacy = localStorage.getItem("ff-theme");
            if (legacy === "light" || legacy === "dark") theme = legacy;
          }
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          if (fonts[font]) {
            document.documentElement.style.setProperty(
              "--font-sans",
              fonts[font],
            );
          }
        } catch (e) {
          /* localStorage blocked — fall through to CSS defaults */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
