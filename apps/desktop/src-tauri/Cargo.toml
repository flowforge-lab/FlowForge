[package]
name = "flowforge-desktop"
version = "0.1.0"
description = "FlowForge desktop app"
authors = ["FlowForge contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "flowforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }

ff-core = { workspace = true }
ff-agent = { workspace = true }
ff-llm = { workspace = true }
ff-memory = { workspace = true }
ff-skills = { workspace = true }
ff-signals = { workspace = true }
ff-tools = { workspace = true }
dirs = "5"
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
url = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
