[package]
name = "flowforge-desktop"
version = "0.1.0"
description = "FlowForge desktop app"
authors = ["FlowForge contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "flowforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }

ff-core = { workspace = true }
ff-agent = { workspace = true }
ff-llm = { workspace = true }
ff-memory = { workspace = true }
ff-session = { workspace = true }
ff-scheduled = { workspace = true }
ff-skills = { workspace = true }
ff-signals = { workspace = true }
ff-tools = { workspace = true }
ff-mcp = { workspace = true }
dirs = "5"
notify = "7"
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
url = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# OS keychain backends, split by target so each platform compiles only its own.
# secrets.rs is provider-agnostic, so this backs every secret-holding provider
# (Bedrock IAM/API keys, SiliconFlow, OpenAI, any OpenAI-compatible). Linux uses
# the Secret Service (DBus) backend, which links libdbus -- the CI image and any
# Linux build need libdbus-1-dev / dbus-devel. See #324.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
