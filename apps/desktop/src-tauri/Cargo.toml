[package]
name = "flowforge-desktop"
version = "0.1.0"
description = "FlowForge desktop app"
authors = ["FlowForge contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "flowforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }

ff-core = { workspace = true }
ff-agent = { workspace = true }
ff-llm = { workspace = true }
ff-memory = { workspace = true }
ff-signals = { workspace = true }
